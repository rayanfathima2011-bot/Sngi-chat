<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="/manifest.json">
<title>Sngi Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef1;font-family:Arial,sans-serif}
.app{max-width:520px;height:100vh;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column}
header{background:#075e54;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.title{font-weight:bold;font-size:18px}.sub{font-size:12px;opacity:.9}
.setup{padding:20px}.card{background:#f6f7f8;padding:18px;border-radius:14px}
.row{display:flex;gap:8px;margin-top:10px}input{padding:13px;border:1px solid #ccc;border-radius:10px;flex:1;min-width:0}
button{padding:12px 15px;border:0;border-radius:10px;background:#128c7e;color:#fff;font-weight:bold}
.secondary{background:#e5e7e9;color:#222}.danger{background:#b42318}.small{font-size:12px;color:#666}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#messages{flex:1;overflow:auto;padding:14px;background:#e5ddd5}
.msg{max-width:82%;margin:7px 0;padding:8px 10px;border-radius:10px;background:#fff;box-shadow:0 1px 1px #0002;position:relative;word-break:break-word}
.mine{margin-left:auto;background:#dcf8c6}.msg img{max-width:100%;border-radius:8px}.msg audio{max-width:100%}
.meta{font-size:10px;color:#667;text-align:right;margin-top:4px}
.name{font-size:11px;font-weight:bold;color:#075e54;margin-bottom:3px}
.del{border:0;background:transparent;color:#777;padding:2px;float:right}
.composer{display:flex;gap:7px;padding:8px;background:#f0f0f0;align-items:center}
.composer input{border:0;border-radius:22px}.attach{padding:10px;font-size:21px;cursor:pointer}
#typing{font-size:11px;color:#667;padding:3px 14px;background:#f0f0f0;min-height:18px}
.topbtn{background:transparent;padding:4px 8px;font-size:20px}
.hidden{display:none}.notice{margin-top:10px;padding:9px;background:#fff3cd;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="title">Sngi Chat</div><div class="sub" id="status">Private 2-person messenger</div></div>
  <button class="topbtn" id="installBtn" style="display:none" title="Install">📲</button>
</header>

<div id="setup" class="setup">
  <div class="card">
    <b>Your name</b>
    <div class="row"><input id="name" maxlength="30" placeholder="Enter your name"></div>
    <div class="notice">Your name is shown only inside this private chat.</div>
    <button style="width:100%;margin-top:14px" id="create">Create pairing code</button>
    <div style="text-align:center;margin:12px">or</div>
    <input id="code" placeholder="Enter partner's code">
    <button style="width:100%;margin-top:10px" id="join">Join chat</button>
    <p id="err"></p>
  </div>
</div>

<div id="chat">
  <div id="messages"></div>
  <div id="typing"></div>
  <div class="composer">
    <label class="attach">📎<input id="file" type="file" accept="image/*" hidden></label>
    <button class="secondary" id="voice" title="Voice message">🎤</button>
    <input id="text" placeholder="Message...">
    <button id="send">➤</button>
  </div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const s=io();
const setup=document.getElementById('setup'), chat=document.getElementById('chat');
const box=document.getElementById('messages'), status=document.getElementById('status');
const typing=document.getElementById('typing');
let myId=null, currentRoom=null, mediaRecorder=null, chunks=[], typingTimer=null;
let myName=localStorage.getItem('sngi_name')||'';

document.getElementById('name').value=myName;

function saveName(){
  myName=document.getElementById('name').value.trim().slice(0,30)||'Guest';
  localStorage.setItem('sngi_name',myName);
  s.emit('set_name',myName);
}
function enter(room,history=[]){
  currentRoom=room; setup.style.display='none'; chat.style.display='flex';
  status.textContent='Pairing code: '+room;
  box.innerHTML=''; history.forEach(add);
}
function add(m){
  const d=document.createElement('div'); d.className='msg '+(m.sender===s.id?'mine':''); d.dataset.id=m.id;
  if(m.deleted){d.textContent='This message was deleted';}
  else{
    const n=document.createElement('div'); n.className='name'; n.textContent=m.name||'Guest'; d.append(n);
    if(m.type==='photo'){const im=document.createElement('img'); im.src=m.data; d.append(im);}
    else if(m.type==='audio'){const au=document.createElement('audio'); au.controls=true; au.src=m.data; d.append(au);}
    else d.append(document.createTextNode(m.data));
    if(m.sender===s.id&&!m.deleted){
      const b=document.createElement('button'); b.className='del'; b.textContent='🗑'; b.onclick=()=>s.emit('delete_for_both',m.id); d.prepend(b);
    }
  }
  const meta=document.createElement('div'); meta.className='meta';
  meta.textContent=new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+(m.sender===s.id&&m.seenBy?.length>1?' • Seen':'');
  d.append(meta); box.append(d); box.scrollTop=box.scrollHeight;
  if(m.sender!==s.id) s.emit('mark_seen',m.id);
}
function updateSeen(x){
  const d=document.querySelector(`[data-id="${x.id}"]`);
  if(!d)return;
  const meta=d.querySelector('.meta');
  if(meta && x.seenBy?.length>1 && d.classList.contains('mine') && !meta.textContent.includes('Seen')) meta.textContent+=' • Seen';
}
s.on('connect',()=>{myId=s.id});
s.on('room_created',x=>{alert('Your pairing code is: '+x.room+'\\nSend this code to the other person.'); enter(x.room); saveName()});
s.on('joined',x=>{enter(x.room,x.messages); saveName()});
s.on('message',add);
s.on('message_seen',updateSeen);
s.on('message_deleted',x=>{
  const d=document.querySelector(`[data-id="${x.id}"]`);
  if(d){d.innerHTML='This message was deleted';const m=document.createElement('div');m.className='meta';m.textContent='deleted for both';d.append(m)}
});
s.on('partner_status',x=>status.textContent=x.online?'Partner online':'Partner offline');
s.on('typing',x=>{typing.textContent=x.isTyping?(x.name+' is typing…'):''});
s.on('error_message',x=>document.getElementById('err').textContent=x);

document.getElementById('create').onclick=()=>{saveName();s.emit('create_room')};
document.getElementById('join').onclick=()=>{saveName();s.emit('join_room',document.getElementById('code').value)};
function send(){
  const i=document.getElementById('text'),v=i.value.trim();
  if(v){s.emit('message',{type:'text',data:v});i.value='';s.emit('typing',false)}
}
document.getElementById('send').onclick=send;
document.getElementById('text').onkeydown=e=>{if(e.key==='Enter')send()};
document.getElementById('text').oninput=()=>{
  s.emit('typing',true); clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>s.emit('typing',false),900);
};
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  if(f.size>8*1024*1024){alert('Please choose an image under 8 MB.');e.target.value='';return}
  const r=new FileReader(); r.onload=()=>s.emit('message',{type:'photo',data:r.result}); r.readAsDataURL(f); e.target.value='';
};

document.getElementById('voice').onclick=async()=>{
  if(mediaRecorder && mediaRecorder.state==='recording'){mediaRecorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia){alert('Voice recording is not supported in this browser.');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});
      if(blob.size>8*1024*1024){alert('Voice message is too large.');return}
      const r=new FileReader(); r.onload=()=>s.emit('message',{type:'audio',data:r.result}); r.readAsDataURL(blob);
      document.getElementById('voice').textContent='🎤';
    };
    mediaRecorder.start(); document.getElementById('voice').textContent='⏹️';
  }catch(e){alert('Microphone permission was not granted.')}
};

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});
document.getElementById('installBtn').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
